name: Web

on:
    pull_request:
        paths:
            - "web/**"
            - ".github/workflows/web.yml"
    push:
        branches:
            - main
        paths:
            - "web/**"
            - ".github/workflows/web.yml"
    workflow_dispatch:

concurrency:
    group: web-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: web

jobs:
    check:
        name: Test and build
        runs-on: ubuntu-latest
        env:
            PUBLIC_BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }}
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3"

            - run: bun install --frozen-lockfile

            - run: bun test

            - run: bun run check

            - run: bun run build

            - uses: actions/upload-artifact@v4
              with:
                  name: web-build
                  path: web/.svelte-kit/cloudflare
                  retention-days: 1

    deploy:
        name: Deploy to Cloudflare Pages
        needs: check
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3"

            - uses: actions/download-artifact@v4
              with:
                  name: web-build
                  path: web/.svelte-kit/cloudflare

            - run: bun install --frozen-lockfile

            - name: Deploy
              run: bunx wrangler pages deploy .svelte-kit/cloudflare --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
