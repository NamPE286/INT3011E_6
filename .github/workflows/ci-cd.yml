name: CI / CD

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-cd-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    CI: true
    WRANGLER_SEND_METRICS: false

jobs:
    backend:
        name: Backend checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: backend
        steps:
            -
                uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
                with:
                    persist-credentials: false
            -
                uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                with:
                    node-version: '22'
            -
                uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
                with:
                    bun-version: '1.3.13'
            -
                name: Install dependencies
                run: bun install --frozen-lockfile
            -
                name: Test
                run: bun run test
            -
                name: Type check
                run: bun run typecheck
            -
                name: Validate D1 migrations locally
                run: bun run d1:migrate:local
            -
                name: Build Worker without deploying
                run: bun run build

    web:
        name: Frontend checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            PUBLIC_BACKEND_URL: http://localhost:8787
        defaults:
            run:
                working-directory: web
        steps:
            -
                uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
                with:
                    persist-credentials: false
            -
                uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                with:
                    node-version: '22'
            -
                uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
                with:
                    bun-version: '1.3.13'
            -
                name: Install dependencies
                run: bun install --frozen-lockfile
            -
                name: Check Svelte and TypeScript
                run: bun run check
            -
                name: Build frontend
                run: bun run build

    deploy:
        name: Deploy production
        needs: [backend, web]
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        env:
            PUBLIC_BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }}
            CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        steps:
            -
                uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
                with:
                    persist-credentials: false
            -
                uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                with:
                    node-version: '22'
            -
                uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
                with:
                    bun-version: '1.3.13'
            -
                name: Validate deployment settings
                env:
                    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                run: |
                    for setting in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PUBLIC_BACKEND_URL CLOUDFLARE_PAGES_PROJECT_NAME; do
                        if [ -z "${!setting}" ]; then
                            echo "::error::Missing $setting. See docs/deployment.md."
                            exit 1
                        fi
                    done
                    if [[ "$PUBLIC_BACKEND_URL" != https://* ]]; then
                        echo "::error::PUBLIC_BACKEND_URL must be the HTTPS production backend URL."
                        exit 1
                    fi
            -
                name: Install backend dependencies
                working-directory: backend
                run: bun install --frozen-lockfile
            -
                name: Install frontend dependencies
                working-directory: web
                run: bun install --frozen-lockfile
            -
                name: Build frontend with production API URL
                working-directory: web
                run: bun run build
            -
                name: Apply production D1 migrations
                working-directory: backend
                env:
                    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                run: bun run d1:migrate:remote
            -
                name: Deploy backend Worker
                working-directory: backend
                env:
                    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                run: bun run deploy
            -
                name: Verify backend health
                run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "${PUBLIC_BACKEND_URL%/}/health"
            -
                name: Deploy frontend to Cloudflare Pages
                working-directory: backend
                env:
                    CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                    CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                run: bunx --no-install wrangler pages deploy --cwd ../web --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch main
